<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Speck — Thin WS Tester (MVP-2a)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: #0e0f13; color: #e8e8ea;
    font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow: hidden;
    /* Stop the browser from scrolling/zooming when dragging on the canvas/stick. */
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  #hud {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(20,22,28,0.82); border: 1px solid #2a2d36;
    border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.5;
    max-width: 320px; backdrop-filter: blur(4px);
  }
  #hud b { color: #81B29A; }
  #status.ok { color: #81B29A; }
  #status.bad { color: #E07A5F; }
  #status.wait { color: #F2CC8F; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  input {
    background: #14161c; border: 1px solid #2a2d36; color: #e8e8ea;
    border-radius: 6px; padding: 4px 6px; font-size: 12px; width: 100%;
  }
  button {
    background: #7EB2DD; color: #0e0f13; border: none; border-radius: 6px;
    padding: 5px 10px; font-size: 12px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  #ready.on { background: #81B29A; }
  #campaign { font-size: 12px; color: #F2CC8F; }
  #hint { margin-top: 8px; color: #8b8f9a; font-size: 11px; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

  /* Compact the HUD on small screens so it never overflows a phone. */
  #hud {
    top: calc(8px + env(safe-area-inset-top));
    left: calc(8px + env(safe-area-inset-left));
  }
  @media (max-width: 520px) {
    #hud { font-size: 12px; max-width: min(88vw, 320px); padding: 8px 10px; }
    #hint { display: none; }
  }

  /* Virtual joystick — only shown on touch devices (toggled via JS). */
  #stick {
    position: fixed;
    left: calc(24px + env(safe-area-inset-left));
    bottom: calc(24px + env(safe-area-inset-bottom));
    width: 132px; height: 132px; z-index: 20;
    border-radius: 50%;
    background: rgba(40,44,54,0.35);
    border: 1px solid rgba(126,178,221,0.35);
    display: none;
    touch-action: none;
  }
  #stick.active { display: block; }
  #knob {
    position: absolute; left: 50%; top: 50%;
    width: 58px; height: 58px; margin: -29px 0 0 -29px;
    border-radius: 50%;
    background: rgba(126,178,221,0.9);
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="hud">
  <div>Speck <b>thin tester</b> — renders server truth (no prediction)</div>
  <div class="row">
    <input id="server" placeholder="ws://localhost:3000" />
  </div>
  <div class="row">
    <input id="room" placeholder="room" style="width:90px" />
    <input id="name" placeholder="name" style="width:90px" />
    <input id="color" placeholder="#E07A5F" style="width:80px" />
  </div>
  <div class="row">
    <button id="connect">Connect</button>
    <button id="disconnect">Disconnect</button>
    <span id="status" class="bad">disconnected</span>
  </div>
  <div>players: <b id="count">0</b> &nbsp; latency: <b id="lat">–</b> ms &nbsp; state: <b id="hz">0</b> Hz</div>
  <div class="row">
    <button id="ready">Ready ✗</button>
    <button id="mute">🔊</button>
    <span id="campaign">lobby</span>
  </div>
  <div id="hint">WASD / arrow keys to move. Open two tabs in the same room to test collisions. Everyone press <b>Ready</b> to auto-start the campaign.</div>
</div>
<canvas id="c"></canvas>
<div id="stick"><div id="knob"></div></div>
<script type="module">
// ---- Shared constants (spec §0) — MUST match physics.rs exactly ----
const ARENA_W = 1800, ARENA_H = 1200;
const PLAYER_R = 22;
const MAX_SPEED = 460;
const ACCEL = 1650;
const FRICTION = 2.35;
const RESTITUTION = 0.82;
const STEP = 1 / 60;
const WALL_PAD = 28;
const PILLARS = [
  [520, 360, 48], [1280, 360, 48],
  [520, 840, 48], [1280, 840, 48],
  [900, 600, 36],
];
const PALETTE = ["#E07A5F", "#81B29A", "#7EB2DD", "#F2CC8F", "#D4A5A5", "#A7C4A0"];

// ---- Prediction/reconciliation tuning (spec §F4) ----
const MAX_INPUT_BUFFER = 64;
const TELEPORT_THRESHOLD = 150;  // px error -> snap
const CORRECTION_RATE = 0.15;    // px error <= threshold -> ease

// ---- Shared physics (mirror of physics.rs) ----
function integrateBody(b, ax, ay, dt) {
  b.vx += ax * dt;
  b.vy += ay * dt;
  const speed = Math.hypot(b.vx, b.vy);
  if (speed > MAX_SPEED) {
    const s = MAX_SPEED / speed;
    b.vx *= s; b.vy *= s;
  }
  const damp = Math.exp(-FRICTION * dt);
  b.vx *= damp; b.vy *= damp;
  b.x += b.vx * dt;
  b.y += b.vy * dt;
}

function resolveWallsBody(b) {
  const minX = WALL_PAD + PLAYER_R, maxX = ARENA_W - WALL_PAD - PLAYER_R;
  const minY = WALL_PAD + PLAYER_R, maxY = ARENA_H - WALL_PAD - PLAYER_R;
  if (b.x < minX) { b.x = minX; if (b.vx < 0) b.vx = -b.vx * RESTITUTION; }
  else if (b.x > maxX) { b.x = maxX; if (b.vx > 0) b.vx = -b.vx * RESTITUTION; }
  if (b.y < minY) { b.y = minY; if (b.vy < 0) b.vy = -b.vy * RESTITUTION; }
  else if (b.y > maxY) { b.y = maxY; if (b.vy > 0) b.vy = -b.vy * RESTITUTION; }
}

// Push self out of a static pillar (B is static: A fully corrected).
function resolvePillarBody(b, px, py, pr) {
  const dx = px - b.x, dy = py - b.y;
  const distSq = dx * dx + dy * dy;
  const rSum = PLAYER_R + pr;
  if (distSq >= rSum * rSum || distSq === 0) return;
  const dist = Math.sqrt(distSq);
  const nx = dx / dist, ny = dy / dist;
  const overlap = rSum - dist;
  b.x -= nx * overlap;
  b.y -= ny * overlap;
  const rvn = -(b.vx * nx + b.vy * ny); // rel vel (B static) along normal
  if (rvn >= 0) return;
  const impulse = -(1 + RESTITUTION) * rvn;
  b.vx -= impulse * nx;
  b.vy -= impulse * ny;
}

// Advance a predicted self body by one input frame. Collides against whatever
// obstacles are authoritative RIGHT NOW: the campaign level's walls while
// playing, otherwise the base pillars. This must match the server's step 3
// (room.rs) or the self dot ghosts through walls and rubber-bands.
function activeObstacles() {
  if (campaign && campaign.phase === "playing" && campaign.walls.length) {
    return campaign.walls.map((w) => [w.x, w.y, w.r]);
  }
  return PILLARS;
}
function stepSelf(b, input, dt) {
  integrateBody(b, input.x * ACCEL, input.y * ACCEL, dt);
  for (const [px, py, pr] of activeObstacles()) resolvePillarBody(b, px, py, pr);
  resolveWallsBody(b);
}

// ---- Query-param / default config ----
const params = new URLSearchParams(location.search);
// Default backend: local dev when opened locally, else the live Railway server.
const PROD_WS = "wss://le-walls-and-balls-production.up.railway.app";
const isLocal = ["localhost", "127.0.0.1"].includes(location.hostname);
const defaultServer = params.get("server") || (isLocal ? "ws://localhost:3000" : PROD_WS);
const $ = (id) => document.getElementById(id);
$("server").value = defaultServer;
$("room").value = params.get("room") || "smoke";
$("name").value = "Web-" + Math.floor(Math.random() * 1000);
$("color").value = PALETTE[Math.floor(Math.random() * PALETTE.length)];

// ---- Canvas / camera ----
const canvas = $("c");
const ctx = canvas.getContext("2d");
let view = { scale: 1, ox: 0, oy: 0 };
function resize() {
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  // Fit the whole arena into the viewport, centered.
  const s = Math.min(canvas.width / ARENA_W, canvas.height / ARENA_H) * 0.92;
  view.scale = s;
  view.ox = (canvas.width - ARENA_W * s) / 2;
  view.oy = (canvas.height - ARENA_H * s) / 2;
}
addEventListener("resize", resize);
resize();
const wx = (x) => view.ox + x * view.scale;
const wy = (y) => view.oy + y * view.scale;

// ---- Networking (raw WebSocket, no framework) ----
let ws = null, selfId = null, joined = false, explicitClose = false;
let players = [];        // latest snapshot (remote truth for other players)
let campaign = null;     // latest campaign block from state (null in free-play)
let iAmReady = false;    // local intent, echoed by server via players[].ready
let inputSeq = 0;
let stateTimestamps = [];
let latencyMs = null;
let pingTimer = null;

// ---- Client-side prediction state (spec §F4) ----
// The locally predicted self body. Rendered immediately with zero RTT lag.
let selfPred = null;               // { x, y, vx, vy } or null until first state
const inputBuffer = [];            // [{ seq, x, y }] sent but maybe unacked

function reconcile(serverSelf) {
  // First authoritative fix: adopt server state outright.
  if (!selfPred) {
    selfPred = { x: serverSelf.x, y: serverSelf.y, vx: serverSelf.vx, vy: serverSelf.vy };
    // Drop everything acknowledged.
    while (inputBuffer.length && inputBuffer[0].seq <= serverSelf.seq) inputBuffer.shift();
    return;
  }

  // 1. Drop inputs the server has already processed.
  while (inputBuffer.length && inputBuffer[0].seq <= serverSelf.seq) inputBuffer.shift();

  // 2. Replay unacknowledged inputs from the authoritative state.
  const replay = { x: serverSelf.x, y: serverSelf.y, vx: serverSelf.vx, vy: serverSelf.vy };
  for (const inp of inputBuffer) stepSelf(replay, inp, STEP);

  // 3. Compare to current prediction; snap on large error, else ease.
  const errX = replay.x - selfPred.x;
  const errY = replay.y - selfPred.y;
  const err = Math.hypot(errX, errY);
  if (err > TELEPORT_THRESHOLD) {
    selfPred.x = replay.x; selfPred.y = replay.y;
  } else if (err > 0.5) {
    selfPred.x += errX * CORRECTION_RATE;
    selfPred.y += errY * CORRECTION_RATE;
  }
  // Take server velocity directly (authoritative) to stay convergent.
  selfPred.vx = replay.vx;
  selfPred.vy = replay.vy;
}

function setStatus(text, cls) {
  const el = $("status"); el.textContent = text; el.className = cls;
}

function teardown(socket) {
  // Detach handlers so this socket's async close/error can't touch app state
  // or trigger reconnect. Then close it quietly.
  if (!socket) return;
  socket.onopen = socket.onmessage = socket.onclose = socket.onerror = null;
  try { socket.close(); } catch {}
}

function connect() {
  // Cleanly retire any previous socket before opening a new one.
  teardown(ws);
  explicitClose = false;
  const url = $("server").value.trim();
  const room = $("room").value.trim() || "smoke";
  const name = $("name").value.trim() || "Web";
  const color = $("color").value.trim() || "#E07A5F";
  setStatus("connecting…", "wait");

  let sock;
  try { sock = new WebSocket(url); } catch (e) { setStatus("bad url", "bad"); return; }
  ws = sock;

  // Guard: only act if this socket is still the current one.
  const isCurrent = () => ws === sock;

  sock.addEventListener("open", () => {
    if (!isCurrent()) return;
    setStatus("connected", "ok");
    sock.send(JSON.stringify({ t: "join", room, name, color }));
    clearInterval(pingTimer);
    pingTimer = setInterval(() => {
      if (isCurrent() && sock.readyState === 1) sock.send(JSON.stringify({ t: "ping", ts: Date.now() }));
    }, 2000);
  });

  sock.addEventListener("message", (ev) => {
    if (!isCurrent()) return;
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    switch (msg.t) {
      case "welcome":
        selfId = msg.id; joined = true; setStatus("joined", "ok");
        selfPred = null; inputBuffer.length = 0; inputSeq = 0;
        iAmReady = false; updateReadyButton();
        break;
      case "state":
        players = msg.players;
        campaign = msg.campaign || null;
        stateTimestamps.push(performance.now());
        if (stateTimestamps.length > 90) stateTimestamps.shift();
        // Reconcile the predicted self dot against server truth.
        if (selfId) {
          const me = players.find((p) => p.id === selfId);
          if (me) reconcile(me);
        }
        break;
      case "pong": latencyMs = Date.now() - msg.ts; break;
      case "player_leave": if (msg.id === "full") setStatus("room full", "bad"); break;
      case "campaign":
        // Edge trigger for level/victory transitions. The authoritative detail
        // rides on state.campaign; this is just a cue. On a new run/level the
        // server clears our ready flag, so reset local intent.
        if (msg.phase === "victory" || msg.level === 0) { iAmReady = false; updateReadyButton(); }
        break;
      case "player_join": case "bump": break;
    }
  });

  sock.addEventListener("close", (ev) => {
    if (!isCurrent()) return;   // a retired socket closing — ignore
    joined = false; players = [];
    clearInterval(pingTimer);
    console.warn("[speck] socket closed", { code: ev.code, reason: ev.reason, wasClean: ev.wasClean, url });
    if (!explicitClose) {
      setStatus(`reconnecting… (closed ${ev.code})`, "wait");
      setTimeout(() => { if (isCurrent()) connect(); }, 1000);
    } else {
      setStatus("disconnected", "bad");
    }
  });
  sock.addEventListener("error", (ev) => {
    if (!isCurrent()) return;   // a retired socket erroring — ignore
    console.error("[speck] socket error connecting to", url, ev);
    setStatus("error — see console (F12)", "bad");
  });
}
$("connect").addEventListener("click", connect);

// Explicitly leave the room and close the socket. `explicitClose` stops the
// close handler from auto-reconnecting. We send `leave` first so the server
// removes us immediately rather than waiting to notice a dead socket.
function disconnect() {
  explicitClose = true;
  clearInterval(pingTimer);
  if (ws && ws.readyState === 1) {
    try { ws.send(JSON.stringify({ t: "leave" })); } catch {}
  }
  teardown(ws);
  ws = null;
  joined = false; selfId = null; players = []; campaign = null;
  iAmReady = false; updateReadyButton();
  setStatus("disconnected", "bad");
}
$("disconnect").addEventListener("click", disconnect);

// The browser doesn't reliably flush a graceful WebSocket close on tab
// close/navigation, which can leave a stale player in the room from a previous
// session. Proactively send `leave` while the socket is still open. `pagehide`
// is the most reliable across mobile/desktop; `beforeunload` covers the rest.
function leaveOnUnload() {
  if (ws && ws.readyState === 1) {
    try { ws.send(JSON.stringify({ t: "leave" })); } catch {}
    try { ws.close(); } catch {}
  }
}
addEventListener("pagehide", leaveOnUnload);
addEventListener("beforeunload", leaveOnUnload);

// ---- Campaign ready toggle ----
function updateReadyButton() {
  const btn = $("ready");
  btn.textContent = iAmReady ? "Ready ✓" : "Ready ✗";
  btn.classList.toggle("on", iAmReady);
}
$("ready").addEventListener("click", () => {
  if (!(ws && ws.readyState === 1 && joined)) return;
  iAmReady = !iAmReady;
  ws.send(JSON.stringify({ t: "ready", ready: iAmReady }));
  updateReadyButton();
});

// ---- Music: one loop per phase, driven purely by campaign.phase/level ----
// Files live in ./audio/ and ship with the site. We have 4 tracks: the lobby
// theme and one per level. Victory reuses the lobby track (it returns you to
// ready-up). Missing files fail silent — never throw.
const MUSIC = {
  lobby: "audio/lobby.mp3",
  level1: "audio/level1.mp3",
  level2: "audio/level2.mp3",
  level3: "audio/level3.mp3",
};
const MUSIC_VOLUME = 0.5;   // target volume for the active track
const FADE_PER_SEC = 1.6;   // cross-fade speed (volume units/sec)

// Pre-create looping Audio elements, one per unique file.
const musicEls = {};
for (const [key, src] of Object.entries(MUSIC)) {
  const a = new Audio(src);
  a.loop = true;
  a.preload = "auto";
  a.volume = 0;
  // Swallow load/decment errors so a missing file is silent, not fatal.
  a.addEventListener("error", () => {});
  musicEls[key] = a;
}

let musicUnlocked = false;   // set true after first user gesture
let musicMuted = false;
let currentTrack = null;     // key of the track we want playing

// Map campaign state -> track key. Null means "no music" (e.g. free-play).
function trackForCampaign() {
  if (!campaign) return null;
  if (campaign.phase === "lobby" || campaign.phase === "victory") return "lobby";
  if (campaign.phase === "playing") {
    const key = "level" + (campaign.level + 1); // level index 0 -> level1
    return MUSIC[key] ? key : "lobby";
  }
  return null;
}

// Switch the desired track. Actual volume easing happens in updateMusic().
function setTrack(key) {
  if (key === currentTrack) return;
  currentTrack = key;
  if (musicUnlocked && key && musicEls[key] && musicEls[key].paused) {
    musicEls[key].play().catch(() => {}); // autoplay/promise rejection -> ignore
  }
}

// Ease every track toward its target volume: the current one up, others down.
// Pause tracks once they've faded fully out to free the decoder.
function updateMusic(dt) {
  const step = FADE_PER_SEC * dt;
  for (const [key, a] of Object.entries(musicEls)) {
    const target = (!musicMuted && key === currentTrack) ? MUSIC_VOLUME : 0;
    if (a.volume < target) a.volume = Math.min(target, a.volume + step);
    else if (a.volume > target) a.volume = Math.max(target, a.volume - step);
    if (a.volume === 0 && !a.paused && key !== currentTrack) a.pause();
  }
}

// Browsers block audio until a user gesture. Unlock on the first interaction,
// then start whatever track the campaign currently wants.
function unlockMusic() {
  if (musicUnlocked) return;
  musicUnlocked = true;
  if (currentTrack && musicEls[currentTrack]) {
    musicEls[currentTrack].play().catch(() => {});
  }
}
addEventListener("pointerdown", unlockMusic, { once: false });
addEventListener("keydown", unlockMusic, { once: false });

$("mute").addEventListener("click", () => {
  musicMuted = !musicMuted;
  $("mute").textContent = musicMuted ? "🔇" : "🔊";
  // If unmuting and a track is wanted, make sure it's playing.
  if (!musicMuted && musicUnlocked && currentTrack) {
    musicEls[currentTrack].play().catch(() => {});
  }
});

// ---- Input: WASD / arrows -> normalized {x,y} ----
const keys = new Set();
addEventListener("keydown", (e) => {
  if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key)) e.preventDefault();
  keys.add(e.key.toLowerCase());
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));

// ---- Touch joystick -> normalized {x,y} ----
const stickEl = $("stick");
const knobEl = $("knob");
const stick = { active: false, id: null, x: 0, y: 0 };
const STICK_RADIUS = 66;   // half of the 132px pad
const STICK_DEAD = 0.12;   // dead zone to avoid jitter

const isTouch = matchMedia("(pointer: coarse)").matches || "ontouchstart" in window;
if (isTouch) stickEl.classList.add("active");

function updateKnob(dx, dy) {
  knobEl.style.transform = `translate(${dx}px, ${dy}px)`;
}
function resetStick() {
  stick.active = false; stick.id = null; stick.x = 0; stick.y = 0;
  updateKnob(0, 0);
  // Send one stopping frame so the server damps to rest cleanly.
  if (lastNonZero) { sendInput(0, 0); lastNonZero = false; }
}
stickEl.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  stick.active = true; stick.id = e.pointerId;
  stickEl.setPointerCapture(e.pointerId);
  handleStickMove(e);
});
stickEl.addEventListener("pointermove", (e) => {
  if (stick.active && e.pointerId === stick.id) { e.preventDefault(); handleStickMove(e); }
});
const endStick = (e) => { if (e.pointerId === stick.id) resetStick(); };
stickEl.addEventListener("pointerup", endStick);
stickEl.addEventListener("pointercancel", endStick);

function handleStickMove(e) {
  const rect = stickEl.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  let dx = e.clientX - cx;
  let dy = e.clientY - cy;
  const dist = Math.hypot(dx, dy);
  const clamped = Math.min(dist, STICK_RADIUS);
  const ux = dist > 0 ? dx / dist : 0;
  const uy = dist > 0 ? dy / dist : 0;
  updateKnob(ux * clamped, uy * clamped);
  // Normalized output in [-1,1], magnitude proportional to displacement.
  const frac = clamped / STICK_RADIUS;
  stick.x = frac < STICK_DEAD ? 0 : ux * frac;
  stick.y = frac < STICK_DEAD ? 0 : uy * frac;
}

function readInput() {
  let x = 0, y = 0;
  if (keys.has("a") || keys.has("arrowleft")) x -= 1;
  if (keys.has("d") || keys.has("arrowright")) x += 1;
  if (keys.has("w") || keys.has("arrowup")) y -= 1;
  if (keys.has("s") || keys.has("arrowdown")) y += 1;
  // Joystick overrides keyboard when engaged.
  if (stick.active && (stick.x !== 0 || stick.y !== 0)) {
    x = stick.x; y = stick.y;
  }
  const mag = Math.hypot(x, y);
  if (mag > 1) { x /= mag; y /= mag; }
  return { x, y };
}

// Send one input frame AND advance the local prediction by one step so the
// self dot reacts instantly (spec §F4). Records the frame for reconciliation.
function sendInput(x, y) {
  if (!(ws && ws.readyState === 1 && joined)) return;
  const seq = inputSeq++;
  ws.send(JSON.stringify({ t: "input", x, y, seq }));
  inputBuffer.push({ seq, x, y });
  if (inputBuffer.length > MAX_INPUT_BUFFER) inputBuffer.shift();
  if (selfPred) stepSelf(selfPred, { x, y }, STEP);
}

let lastNonZero = false;
// Event-driven: fire immediately on any keyboard transition (no rAF wait).
function onKeyChange() {
  const { x, y } = readInput();
  const nonZero = x !== 0 || y !== 0;
  if (nonZero || lastNonZero) sendInput(x, y);
  lastNonZero = nonZero;
}
addEventListener("keydown", onKeyChange);
addEventListener("keyup", onKeyChange);

// While a direction is held (keyboard or stick), pump input at the sim rate so
// prediction and server stay in lock-step — decoupled from the render rate.
let inputAccumulator = 0;
function pumpHeldInput(dt) {
  const { x, y } = readInput();
  const nonZero = x !== 0 || y !== 0;
  if (!nonZero) { inputAccumulator = 0; lastNonZero = false; return; }
  inputAccumulator += dt;
  let guard = 0;
  while (inputAccumulator >= STEP && guard < 8) {
    inputAccumulator -= STEP;
    sendInput(x, y);
    guard++;
  }
  lastNonZero = true;
}

// ---- Render loop ----
let lastFrameTs = performance.now();
function draw(now) {
  now = now || performance.now();
  let dt = (now - lastFrameTs) / 1000;
  lastFrameTs = now;
  if (dt > 0.1) dt = 0.1; // clamp after tab was backgrounded
  pumpHeldInput(dt);

  // Music follows the campaign phase/level (client-only; no server involvement).
  setTrack(trackForCampaign());
  updateMusic(dt);

  ctx.fillStyle = "#0e0f13";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Arena bounds (full extent) — faint.
  ctx.strokeStyle = "#2a2d36";
  ctx.lineWidth = 2 * view.scale;
  ctx.strokeRect(wx(0), wy(0), ARENA_W * view.scale, ARENA_H * view.scale);

  // Playable border: the inset the physics engine actually clamps the player
  // CENTER to (WALL_PAD + PLAYER_R on each side). Drawing this makes the
  // "invisible wall" the player stops at visible and true to the sim.
  {
    const pad = WALL_PAD + PLAYER_R;
    ctx.strokeStyle = "rgba(126,178,221,0.35)";
    ctx.lineWidth = 1.5 * view.scale;
    ctx.strokeRect(
      wx(pad), wy(pad),
      (ARENA_W - pad * 2) * view.scale, (ARENA_H - pad * 2) * view.scale
    );
  }

  // Grid.
  ctx.strokeStyle = "rgba(255,255,255,0.03)";
  ctx.lineWidth = 1;
  for (let gx = 0; gx <= ARENA_W; gx += 150) {
    ctx.beginPath(); ctx.moveTo(wx(gx), wy(0)); ctx.lineTo(wx(gx), wy(ARENA_H)); ctx.stroke();
  }
  for (let gy = 0; gy <= ARENA_H; gy += 150) {
    ctx.beginPath(); ctx.moveTo(wx(0), wy(gy)); ctx.lineTo(wx(ARENA_W), wy(gy)); ctx.stroke();
  }

  const playing = campaign && campaign.phase === "playing";

  // Draw a static obstacle: the solid body at radius r, plus a faint ring at
  // r + PLAYER_R showing the true no-go boundary the player CENTER can't cross
  // (matches resolve_circle_circle against a static body). Without the ring the
  // player appears to stop short of the drawn edge.
  function drawObstacle(px, py, pr) {
    // Collision boundary (player center limit).
    ctx.beginPath();
    ctx.arc(wx(px), wy(py), (pr + PLAYER_R) * view.scale, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(58,63,75,0.28)";
    ctx.fill();
    ctx.lineWidth = 1 * view.scale;
    ctx.strokeStyle = "rgba(126,178,221,0.25)";
    ctx.stroke();
    // Solid body.
    ctx.beginPath();
    ctx.arc(wx(px), wy(py), pr * view.scale, 0, Math.PI * 2);
    ctx.fillStyle = "#3a3f4b";
    ctx.fill();
  }

  // Base pillars: only in free-play / lobby. During a campaign the level's own
  // walls replace them, so we don't draw both.
  if (!playing) {
    for (const [px, py, pr] of PILLARS) drawObstacle(px, py, pr);
  }

  // Campaign layer: exit zone (under everything), walls, items, enemies.
  if (playing) {
    const c = campaign;
    // Exit zone — filled ring the group gathers in. Turns green once cleared.
    const cleared = c.enemies.every((e) => !e.alive);
    ctx.beginPath();
    ctx.arc(wx(c.exit.x), wy(c.exit.y), c.exit.r * view.scale, 0, Math.PI * 2);
    ctx.fillStyle = cleared ? "rgba(129,178,154,0.16)" : "rgba(242,204,143,0.10)";
    ctx.fill();
    ctx.lineWidth = 2 * view.scale;
    ctx.strokeStyle = cleared ? "rgba(129,178,154,0.8)" : "rgba(242,204,143,0.6)";
    ctx.setLineDash([10 * view.scale, 8 * view.scale]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Walls (static obstacles) — body + true collision boundary.
    for (const w of c.walls) drawObstacle(w.x, w.y, w.r);

    // Items (uncollected only).
    for (const it of c.items) {
      if (it.collected) continue;
      const r = 16 * view.scale;
      ctx.beginPath(); ctx.arc(wx(it.x), wy(it.y), r, 0, Math.PI * 2);
      ctx.fillStyle = "#F2CC8F"; ctx.fill();
      ctx.lineWidth = 2 * view.scale; ctx.strokeStyle = "#ffffff"; ctx.stroke();
    }

    // Enemies (living only). Red dots with an HP pip count.
    for (const e of c.enemies) {
      if (!e.alive) continue;
      ctx.beginPath(); ctx.arc(wx(e.x), wy(e.y), e.r * view.scale, 0, Math.PI * 2);
      ctx.fillStyle = "#E07A5F"; ctx.fill();
      ctx.lineWidth = 2 * view.scale; ctx.strokeStyle = "#3a1a12"; ctx.stroke();
      ctx.fillStyle = "#2a0f0a";
      ctx.font = `${Math.max(10, 12 * view.scale)}px system-ui`;
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(e.hp), wx(e.x), wy(e.y));
      ctx.textBaseline = "alphabetic";
    }
  }

  // Players. Remotes render at server truth; the self dot renders at the
  // locally PREDICTED position for zero-latency feel (spec §F4).
  for (const p of players) {
    const isSelf = p.id === selfId;
    // Use prediction for self when available, else fall back to server truth.
    const rx = isSelf && selfPred ? selfPred.x : p.x;
    const ry = isSelf && selfPred ? selfPred.y : p.y;
    ctx.beginPath();
    ctx.arc(wx(rx), wy(ry), PLAYER_R * view.scale, 0, Math.PI * 2);
    ctx.fillStyle = p.color || "#E07A5F";
    ctx.globalAlpha = isSelf ? 1 : 0.85;
    ctx.fill();
    ctx.globalAlpha = 1;
    if (isSelf) {
      ctx.lineWidth = 3 * view.scale; ctx.strokeStyle = "#ffffff"; ctx.stroke();
    }
    // Name label.
    ctx.fillStyle = "#e8e8ea";
    ctx.font = `${Math.max(11, 13 * view.scale)}px system-ui`;
    ctx.textAlign = "center";
    ctx.fillText(p.name || "player", wx(rx), wy(ry) - (PLAYER_R + 8) * view.scale);
  }

  // HUD stats.
  $("count").textContent = players.length;
  $("lat").textContent = latencyMs == null ? "–" : latencyMs;

  // Campaign status line.
  if (campaign) {
    const c = campaign;
    if (c.phase === "lobby") {
      const readyCount = players.filter((p) => p.ready).length;
      $("campaign").textContent = `lobby — ready ${readyCount}/${c.total}`;
    } else if (c.phase === "playing") {
      const alive = c.enemies.filter((e) => e.alive).length;
      const items = c.items.filter((it) => !it.collected).length;
      $("campaign").textContent =
        `level ${c.level + 1}/${c.levels} — enemies ${alive} · items ${items} · in-zone ${c.in_zone}/${c.total}`;
    } else if (c.phase === "victory") {
      $("campaign").textContent = "🏆 victory! ready up to run again";
    }
  } else {
    $("campaign").textContent = "free-play";
  }
  if (stateTimestamps.length > 2) {
    const span = (stateTimestamps[stateTimestamps.length - 1] - stateTimestamps[0]) / 1000;
    $("hz").textContent = span > 0 ? (stateTimestamps.length / span).toFixed(0) : "0";
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

// Auto-connect on load when a ?server= was provided, or when served remotely
// (e.g. from Netlify) where the default already points at the Railway backend.
if (params.get("server") || !isLocal) connect();
</script>
</body>
</html>
